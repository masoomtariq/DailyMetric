<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Command - Habit Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; max-width: 600px; margin: auto; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        pre { background: #f4f4f4; padding: 15px; border: 1px solid #ddd; overflow-x: auto; min-height: 100px; }
        #logoutBtn { background-color: #dc3545; margin-bottom: 20px; padding: 5px 10px; float: right; }
    </style>
</head>
<body>

    <button id="logoutBtn" onclick="logout()">Logout</button>
    <h2>Habit Tracker Chat</h2>
    <p>Enter your command (e.g., <code>/activity --name "Sample" -d 2026-06-21</code>):</p>
    
    <form id="chatForm">
        <div class="input-group">
            <input type="text" id="commandInput" placeholder="Type a command..." required>
            <button type="submit">Send</button>
        </div>
    </form>

    <h3>Response:</h3>
    <pre id="output">No response yet...</pre>

    <script>
        // 1. On page load, verify we have a token
        const token = localStorage.getItem("access_token");
        if (!token) {
            alert("You are not logged in! Redirecting to login page.");
            window.location.href = "index.html";
        }

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "index.html";
        }

        // 2. Handle form submission
        document.getElementById("chatForm").addEventListener("submit", async function(event) {
            event.preventDefault(); // Prevent page reload
            
            const command = document.getElementById("commandInput").value;
            const outputBox = document.getElementById("output");
            outputBox.innerText = "Loading...";

            try {
                // Call your /chat endpoint
                const response = await fetch("https://masoomtariq-habit-tracker.hf.space/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}` // Pass the token here
                    },
                    // Because FastAPI has Body(..., embed=True), we wrap the command in a JSON object
                    body: JSON.stringify({ command: command }) 
                });

                const data = await response.json();

                // If token is expired or invalid
                if (response.status === 401) {
                    alert("Session expired. Please log in again.");
                    logout();
                    return;
                }

                // Pretty print the JSON response into the <pre> block
                outputBox.innerText = JSON.stringify(data, null, 2);

            } catch (error) {
                outputBox.innerText = "Error: Failed to connect to backend.\n" + error;
                console.error(error);
            }
        });
    </script>
</body>
</html>
