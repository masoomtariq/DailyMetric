<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Chat</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        #outputBox { background: #f4f4f4; padding: 15px; min-height: 100px; margin-bottom: 15px; border-radius: 5px; white-space: pre-wrap; }
        input, button { padding: 10px; margin: 5px 0; }
        input[type="text"] { width: 75%; }
        button { cursor: pointer; }
        .header { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Habit Tracker AI</h2>
        <button onclick="logout()">Logout</button>
    </div>
    
    <div id="outputBox">Ready for your command...</div>
    
    <input type="text" id="command" placeholder="E.g., /activity --name Sample -d 2026-06-21">
    <button onclick="sendCommand()">Send</button>

    <script>
        if (!localStorage.getItem("access_token")) {
            window.location.href = "index.html";
        }

        async function sendCommand() {
            const commandInput = document.getElementById("command");
            const command = commandInput.value.trim();
            const outputBox = document.getElementById("outputBox");
            
            let token = localStorage.getItem("access_token");
            let refreshToken = localStorage.getItem("refresh_token");

            if (!command) return;

            outputBox.innerText = "Processing...";
            commandInput.value = ""; 

            try {
                let response = await fetch("https://masoomtariq-habit-tracker.hf.space/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}` 
                    },
                    body: JSON.stringify({ command: command }) 
                });

                if (response.status === 401) {
                    outputBox.innerText = "Session expired. Attempting to refresh...";
                    
                    if (!refreshToken) {
                        alert("No refresh token found. Please log in again.");
                        logout();
                        return;
                    }

                    // Send the refresh token in the body
                    const refreshResponse = await fetch("https://masoomtariq-habit-tracker.hf.space/auth/refresh", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ refresh_token: refreshToken })
                    });

                    if (refreshResponse.ok) {
                        const refreshData = await refreshResponse.json();
                        
                        localStorage.setItem("access_token", refreshData.access_token);
                        token = refreshData.access_token; 
                        
                        outputBox.innerText = "Session refreshed. Retrying command...";

                        response = await fetch("https://masoomtariq-habit-tracker.hf.space/chat", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${token}` 
                            },
                            body: JSON.stringify({ command: command }) 
                        });
                    } else {
                        alert("Your session has permanently expired. Please log in again.");
                        logout();
                        return;
                    }
                }

                if (response.ok) {
                    const data = await response.json();
                    outputBox.innerText = JSON.stringify(data, null, 2);
                } else {
                    const errorData = await response.json();
                    outputBox.innerText = `Error: ${errorData.detail || "Failed to process command"}`;
                }

            } catch (error) {
                console.error("Request failed:", error);
                outputBox.innerText = "A network error occurred. Please try again.";
            }
        }

        function logout() {
            localStorage.removeItem("access_token");
            localStorage.removeItem("refresh_token"); // Clean up the refresh token
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
