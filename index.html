<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Habit Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; max-width: 400px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; color: red; }
    </style>
</head>
<body>

    <h2>Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="phone_number">Phone Number</label>
            <input type="text" id="phone_number" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <div id="message"></div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault(); // Prevent page reload
            
            const phone_number = document.getElementById("phone_number").value;
            const password = document.getElementById("password").value;
            const messageDiv = document.getElementById("message");

            messageDiv.style.color = "black";
            messageDiv.innerText = "Logging in...";

            try {
                // Call your /auth/login endpoint
                const response = await fetch("https://masoomtariq-habit-tracker.hf.space/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    // We send this as JSON based on your user_create/login_user pydantic schemas
                    body: JSON.stringify({ phone_number, password }) 
                });

                const data = await response.json();

                if (response.ok) {
                    // Save the token to local storage
                    localStorage.setItem("access_token", data.access_token);
                    messageDiv.style.color = "green";
                    messageDiv.innerText = "Login successful! Redirecting to chat...";
                    
                    // Redirect to the chat page
                    setTimeout(() => {
                        window.location.href = "chat.html";
                    }, 1000);
                } else {
                    messageDiv.style.color = "red";
                    messageDiv.innerText = data.detail || "Login failed. Check your credentials.";
                }
            } catch (error) {
                messageDiv.style.color = "red";
                messageDiv.innerText = "Error connecting to the server.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
