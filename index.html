<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Login</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>Login to Habit Tracker</h2>
    <form id="loginForm">
        <input type="text" id="phone_number" placeholder="Phone Number" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const phone_number = document.getElementById("phone_number").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("https://masoomtariq-habit-tracker.hf.space/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ phone_number, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    // Save both tokens to local storage
                    localStorage.setItem("access_token", data.access_token);
                    localStorage.setItem("refresh_token", data.refresh_token);
                    window.location.href = "chat.html";
                } else {
                    const errorData = await response.json();
                    alert("Login failed: " + (errorData.detail || "Invalid credentials"));
                }
            } catch (error) {
                console.error("Error during login:", error);
                alert("An error occurred while logging in.");
            }
        });
    </script>
</body>
</html>
