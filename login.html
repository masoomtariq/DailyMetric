<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
                            400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                            800: '#075985', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="h-full text-slate-800 font-sans flex flex-col">

    <header class="bg-gradient-to-r from-primary-800 to-primary-950 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm border border-white/10">
                    <i class="fa-solid fa-square-poll-vertical text-2xl text-primary-300"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight flex items-center gap-2">
                        Habit Tracker <span class="text-xs bg-primary-500 text-white font-semibold py-0.5 px-2 rounded-full uppercase">Login</span>
                    </h1>
                    <p class="text-xs text-primary-200">Authenticate to access control panel</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div class="bg-black/20 px-3 py-1.5 rounded-lg text-xs border border-white/5 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <label for="api-url-input" class="text-primary-300 font-medium">API Base:</label>
                    <input type="text" id="api-url-input" value="https://masoomtariq-habit-tracker.hf.space" 
                           class="bg-transparent border-0 text-white font-mono focus:ring-0 w-36 outline-none hover:bg-white/5 p-0.5 rounded cursor-pointer">
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-md w-full mx-auto px-4 sm:px-6 lg:px-8 py-16">
        
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden transition-all duration-300 hover:shadow-md">
            <div class="border-b border-slate-100 bg-slate-50/50 px-6 py-4 flex justify-between items-center">
                <h2 class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-primary-600"></i> Authentication
                </h2>
            </div>
            
            <div class="p-6">
                <div class="flex bg-slate-100 p-1 rounded-xl mb-6 text-sm" role="tablist">
                    <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-1.5 text-center font-bold rounded-lg text-primary-700 bg-white shadow-sm transition-all">
                        Login
                    </button>
                    <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-1.5 text-center font-medium rounded-lg text-slate-600 hover:text-slate-900 transition-all">
                        Register
                    </button>
                    <button id="tab-token" onclick="switchAuthTab('token')" class="flex-1 py-1.5 text-center font-medium rounded-lg text-slate-600 hover:text-slate-900 transition-all">
                        Token
                    </button>
                </div>

                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Phone Number</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                                <i class="fa-solid fa-phone text-sm"></i>
                            </span>
                            <input type="text" id="login-phone" required placeholder="e.g. +923001234567" 
                                   class="pl-10 w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-2.5 text-sm outline-none transition-all focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                                <i class="fa-solid fa-lock text-sm"></i>
                            </span>
                            <input type="password" id="login-password" required placeholder="••••••••" 
                                   class="pl-10 w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-2.5 text-sm outline-none transition-all focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow-sm transition-all duration-150 transform active:scale-95 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Sign In
                    </button>
                </form>

                <form id="form-register" onsubmit="handleRegister(event)" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Full Name</label>
                        <input type="text" id="reg-name" required placeholder="e.g. John Doe" 
                               class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3 py-2 text-sm outline-none transition-all focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Phone Number</label>
                        <input type="text" id="reg-phone" required placeholder="e.g. +923001234567" 
                               class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3 py-2 text-sm outline-none transition-all focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Email</label>
                        <input type="email" id="reg-email" required placeholder="e.g. john@example.com" 
                               class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3 py-2 text-sm outline-none transition-all focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Timezone</label>
                        <input type="text" id="reg-timezone" required value="Asia/Karachi" placeholder="e.g. Asia/Karachi" 
                               class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3 py-2 text-sm outline-none transition-all focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Password</label>
                        <input type="password" id="reg-password" required placeholder="Minimum 6 characters" 
                               class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3 py-2 text-sm outline-none transition-all focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Registration Secret</label>
                        <input type="text" id="reg-secret" required placeholder="Enter server secret text" 
                               class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3 py-2 text-sm outline-none transition-all focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow-sm transition-all duration-150 transform active:scale-95 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Register
                    </button>
                </form>

                <div id="form-token" class="hidden space-y-4">
                    <p class="text-xs text-slate-500 leading-relaxed">
                        Directly paste your bearer JWT token here if you have authenticated via external tools.
                    </p>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Access Token</label>
                        <textarea id="manual-access-token" rows="4" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." 
                                  class="font-mono text-[11px] leading-normal w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3.5 py-2.5 outline-none transition-all focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100"></textarea>
                    </div>
                    <button onclick="saveManualToken()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow-sm transition-all duration-150 transform active:scale-95 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Apply Token
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('token')) {
                window.location.href = 'dashboard.html';
            }
        });

        function getApiUrl() {
            const val = document.getElementById('api-url-input').value.trim();
            return val || 'http://127.0.0.1:8000';
        }

        // Minimal alert logger for the login page
        function logToConsole(message, data = null, status = 'info') {
            console.log(message, data);
            if (status === 'error') alert("Error: " + message);
        }

        function switchAuthTab(tab) {
            const tabs = {
                login: document.getElementById('tab-login'),
                register: document.getElementById('tab-register'),
                token: document.getElementById('tab-token')
            };
            const forms = {
                login: document.getElementById('form-login'),
                register: document.getElementById('form-register'),
                token: document.getElementById('form-token')
            };

            Object.keys(tabs).forEach(k => {
                if (k === tab) {
                    tabs[k].className = "flex-1 py-1.5 text-center font-bold rounded-lg text-primary-700 bg-white shadow-sm transition-all";
                    forms[k].classList.remove('hidden');
                } else {
                    tabs[k].className = "flex-1 py-1.5 text-center font-medium rounded-lg text-slate-600 hover:text-slate-900 transition-all";
                    forms[k].classList.add('hidden');
                }
            });
        }

        async function handleLogin(event) {
            event.preventDefault();
            const phone = document.getElementById('login-phone').value.trim();
            const password = document.getElementById('login-password').value;
            const apiBase = getApiUrl();

            try {
                const response = await fetch(`${apiBase}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: phone, password: password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    window.location.href = 'dashboard.html'; // Redirect to main app
                } else {
                    logToConsole(`Login failed with status ${response.status}`, data, 'error');
                }
            } catch (error) {
                logToConsole("Network connection failure trying to login.", error.toString(), 'error');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const timezone = document.getElementById('reg-timezone').value.trim();
            const password = document.getElementById('reg-password').value;
            const secret = document.getElementById('reg-secret').value.trim();
            const apiBase = getApiUrl();

            try {
                const response = await fetch(`${apiBase}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name, phone_number: phone, email: email,
                        timezone: timezone, password: password, secret_text: secret
                    })
                });

                if (response.ok) {
                    alert("User registration succeeded! You can now log in.");
                    switchAuthTab('login');
                    document.getElementById('login-phone').value = phone;
                } else {
                    const data = await response.json();
                    logToConsole(`Registration failed with status ${response.status}`, data, 'error');
                }
            } catch (error) {
                logToConsole("Network connection failure during user registration.", error.toString(), 'error');
            }
        }

        function saveManualToken() {
            const token = document.getElementById('manual-access-token').value.trim();
            if (token) {
                localStorage.setItem('token', token);
                window.location.href = 'dashboard.html'; // Redirect to main app
            }
        }
    </script>
</body>
</html>
